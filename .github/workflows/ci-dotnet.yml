name: CI (.NET)

on:
  push:
    branches:
      - master
      - migration/**
  pull_request:
    branches:
      - master

jobs:
  dotnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        run: dotnet restore HelseLoop.slnx

      - name: Build
        run: dotnet build HelseLoop.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test HelseLoop.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet/**/TestResults/*.trx
          if-no-files-found: warn
